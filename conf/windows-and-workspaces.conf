##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more

windowrule = tile, title: WhatsApp Web

# $terminal rules
windowrule = minsize 720 500, class: $terminal
windowrule = maxsize 1080 720, class: $terminal
# windowrule = float, class: $terminal

# Special:magic workspace rules
workspace = special:magic, gapsout:50 100 50 100, bordersize:1

# Removes gaps when a single window is open (ignores special workspace)
# See: https://wiki.hypr.land/Configuring/Workspace-Rules/#smart-gaps
workspace = w[tv1]s[false], gapsout:0, gapsin:0
workspace = f[1]s[false], gapsout:0, gapsin:0
windowrule = bordersize 0, floating:0, onworkspace:w[tv1]s[false]
windowrule = rounding 0, floating:0, onworkspace:w[tv1]s[false]
windowrule = bordersize 0, floating:0, onworkspace:f[1]s[false]
windowrule = rounding 0, floating:0, onworkspace:f[1]s[false]

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
